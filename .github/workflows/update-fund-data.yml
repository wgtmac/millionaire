name: Update fund data

on:
  workflow_dispatch:
  schedule:
    # Runs at 23:37 Asia/Shanghai. GitHub Actions cron is UTC.
    - cron: '37 15 * * *'

permissions:
  contents: write

concurrency:
  group: update-fund-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update fund data
        run: node tools/update-data.mjs

      - name: Verify generated site
        run: |
          node --test
          node --check app.js
          node --check chart-helpers.js
          node --check stock-data.js
          node --check tools/data-store.mjs
          node --check tools/generate-stock-data.mjs
          node --check tools/add-record.mjs
          node --check tools/eastmoney-source.mjs
          node --check tools/update-data.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/records.json stock-data.js; then
            echo "No fund data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json stock-data.js
          git commit -m "Update fund data"
          git push
